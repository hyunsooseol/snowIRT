---
name:  logit
title: DIF for ordinal data
jrs:   '1.1'
refs: snowIRT
items:
    - name: instructions
      title: Instructions
      type: Html
      visible: True

    - name: method
      title: '`Likelihood ratio Chi-square statistics - ${padjust}`'
      type: Table
      visible: (method)
      rows: (vars)
      clearWith:
        - vars
        - group
        - model
        - type
        - match
        - padjust
        - anchorMethod
        - anchor
      refs: difNLR
        
      columns:
        - name: name
          title: ''
          type: 'text'
          content: ($key)
        - name: chi
          title: 'Statistic'
          type: 'number'
        - name: p
          title: 'p'
          format: zto,pvalue 
        - name: padj
          title: 'Adj.p'
          format: zto,pvalue 

    - name: plot
      title: DIF Plot
      type: Image
      width: 600
      height: 450
      renderFun: .plot
      visible: (plot)
      clearWith:
        - vars
        - group
        - model
        - type
        - match
        - padjust
        - plotItem
        - anchorMethod
        - anchor
        - plotLayout
...
