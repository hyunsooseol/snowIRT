---
name: item
title: Distractor analysis
jrs: '1.1'
refs: snowIRT
items:
    - name: instructions
      title: Instructions
      type: Html
      visible: true

    - name: text
      title: ""
      type: Preformatted

    - name: sum
      title: Item summary
      type: Array
      visible: (sum)
      items: (vars)
      template:
          title: Item $key
          type: Table
          rows: 0
          clearWith:
            - vars
            - key
            - group
          columns: &optionSummaryColumns
            - name: correct
              title: Correct
              type: text
            - name: key
              title: Response
              type: text
            - name: n
              title: Frequency
              type: integer
            - name: rspP
              title: Proportion
              type: number
            - name: pBis
              title: Point-biserial r
              type: number
            - name: discrim
              title: Upper - lower
              type: number

    - name: count
      title: Counts of respondents
      type: Array
      visible: (count)
      items: (vars)
      template:
          title: Item $key
          type: Table
          rows: 0
          clearWith:
            - vars
            - key
            - group
          columns:
            - name: response
              title: Response
              type: text
            - name: total
              title: Total
              type: integer

    - name: prop
      title: Proportions of respondents
      type: Array
      visible: (prop)
      items: (vars)
      template:
          title: Item $key
          type: Table
          rows: 0
          clearWith:
            - vars
            - key
            - group
          columns:
            - name: response
              title: Response
              type: text
            - name: total
              title: Total
              type: number

    - name: sum1
      title: Total summary
      type: Array
      visible: (sum1)
      items: (vars)
      template:
          title: Item $key
          type: Table
          rows: 0
          clearWith:
            - vars
            - key
            - group
          columns: *optionSummaryColumns

    - name: disc
      title: Item difficulty and discrimination index
      type: Table
      visible: (disc)
      rows: (vars)
      clearWith:
        - vars
        - key
        - group
      columns:
        - name: name
          title: Item
          type: text
          content: ($key)
        - name: dif
          title: Difficulty
        - name: ULI
          title: ULI
        - name: RIT
          title: RIT
        - name: RIR
          title: RIR

    - name: plot2
      title: Histogram of total score
      type: Image
      width: 600
      height: 450
      visible: (plot2)
      renderFun: .plot2
      clearWith:
        - vars
        - key

    - name: plot
      title: Distractor plot
      type: Image
      width: 600
      height: 450
      visible: (plot)
      renderFun: .plot
      clearWith:
        - vars
        - num
        - group
        - key

    - name: plot1
      title: Discrimination plot
      type: Image
      width: 600
      height: 450
      visible: (plot1)
      renderFun: .plot1
      clearWith:
        - vars
        - disi
        - angle
        - key
        - group

    - name: total
      title: Total
      type: Output
      varTitle: Total
      measureType: continuous
      clearWith:
        - vars
        - key

    - name: scoring
      title: Scoring
      type: Output
      clearWith:
        - vars
        - key

    - name: plot3
      title: Empirical Item Characteristic Curve
      type: Image
      width: 600
      height: 450
      visible: (plot3)
      renderFun: .plot3
      clearWith:
        - vars
        - num1
        - key

...
