title: DIF for ordinal data
name: logit
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
            ghostText: Required
      - type: TargetLayoutBox
        label: Anchor Items
        children:
          - type: VariablesListBox
            name: anchor
            isTarget: true

  - type: CollapseBox
    label: 'Model Options'
    margin: normal
    collapsed: true
    children:
      - type: Label
        label: ''
        margin: large
        children:
          - type: ComboBox
            name: model
            format: number
          - type: ComboBox
            name: type
          - type: ComboBox
            name: match
  - type: CollapseBox
    label: 'Analysis'
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        margin: large
        children:
          - type: Label
            label: 'Table'
            children:
              - type: CheckBox
                name: method
                children:
                  - type: ComboBox
                    name: padjust
                    enable: (method)
          - type: Label
            label: 'Matching'
            children:
              - type: ComboBox
                name: anchorMethod

      - type: LayoutBox
        stretchFactor: 1
        margin: large
        cell:
          column: 1
          row: 0
        fitToGrid: true
        children:
          - type: Label
            label: Plot
            children:
              - type: CheckBox
                name: plot
                children:
                  - type: TextBox
                    name: plotItem
                    format: number
                    enable: (plot)
